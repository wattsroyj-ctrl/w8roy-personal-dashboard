name: Refresh dashboard news

on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/refresh-news.yml'
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4

      - name: Fetch Google News RSS feeds
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          feeds = {
              "world": "https://news.google.com/rss/search?q=US+OR+world+news+when:2d&hl=en-US&gl=US&ceid=US:en",
              "local": "https://news.google.com/rss/search?q=Michigan+OR+Detroit+OR+%22Metro+Detroit%22+when:2d&hl=en-US&gl=US&ceid=US:en",
          }

          result = {"updated": datetime.now(timezone.utc).isoformat(), "feeds": {}}
          for key, url in feeds.items():
              request = urllib.request.Request(url, headers={"User-Agent": "W8ROY-Dashboard/1.0"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  root = ET.fromstring(response.read())
              items = []
              for item in root.findall("./channel/item")[:8]:
                  title = item.findtext("title", default="").strip()
                  link = item.findtext("link", default="").strip()
                  source = item.findtext("source", default="Google News").strip()
                  pub_date = item.findtext("pubDate", default="").strip()
                  if title and link:
                      items.append({"title": title, "link": link, "source": source, "pubDate": pub_date})
              if not items:
                  raise RuntimeError(f"No headlines returned for {key}")
              result["feeds"][key] = items

          with open("news.json", "w", encoding="utf-8") as output:
              json.dump(result, output, ensure_ascii=False, indent=2)
          PY

      - name: Commit updated headlines
        run: |
          if git diff --quiet -- news.json; then
            echo "Headlines are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Refresh dashboard news headlines"
          git push
